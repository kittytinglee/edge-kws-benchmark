[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-kws-benchmark"
version = "0.1.0"
description = "Lightweight keyword spotting models and benchmarks for edge devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchaudio>=2.2"]

[tool.setuptools.packages.find]
include = ["edge_kws*"]

